# Injetado em /etc/nginx/conf.d/default.conf pelo compose do Odysseus.
# Injeta o header exigido pelo OpenCode Go (sessao estavel para roteamento)
# e faz proxy para opencode.ai.
#
# Preparado para streaming (SSE): sem buffering nos eventos do chat.
server {
    listen 7317;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass https://opencode.ai;
        proxy_ssl_server_name on;
        proxy_ssl_name opencode.ai;
        proxy_set_header Host opencode.ai;
        proxy_set_header x-opencode-session "0d3f9a4e-7c1b-4f2a-9d51-3b6c2f8e7a10";
        proxy_set_header User-Agent "odysseus/1.0";
        proxy_set_header Accept-Encoding "";
    }
}
