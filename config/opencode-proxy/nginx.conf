worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;
    client_max_body_size 32m;

    # Streaming (SSE) do chat: nao bufferizar a resposta.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    server {
        listen 7317;

        location / {
            proxy_pass https://opencode.ai;
            proxy_ssl_server_name on;
            proxy_ssl_name opencode.ai;
            proxy_set_header Host opencode.ai;
            # Header exigido pelo OpenCode Go (sessao estavel para roteamento).
            proxy_set_header x-opencode-session "0d3f9a4e-7c1b-4f2a-9d51-3b6c2f8e7a10";
            proxy_set_header User-Agent "odysseus/1.0";
            proxy_set_header Accept-Encoding "";
        }
    }
}
